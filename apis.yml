name: Swimm
description: 'Swimm is a codebase-understanding and modernization platform that combines deterministic
  static analysis, AI agents, and senior engineers to help teams understand, document, and safely transform
  large or legacy codebases. Its core product is an AI coding assistant that helps developers understand
  complex code and capture that knowledge as code-coupled documentation that stays in sync with the source,
  with IDE integrations, CI verification, and an agentic context layer that feeds validated knowledge to
  tools like Copilot, Cursor, and Claude Code. Swimm also runs large-scale modernization engagements (.NET,
  Java, monolith-to-microservices, and mainframe/COBOL). Swimm publishes product documentation, a getting-started
  guide, IDE and CI integrations, and a GitHub organization, but does not expose a public REST/developer
  API, SDK packages, or OpenAPI specification at this time.'
